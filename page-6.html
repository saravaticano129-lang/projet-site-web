
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 ART — Rejoignez-nous</title>

    <!-- Feuilles de style -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="frame">

        <!-- EN-TÊTE -->
        <header class="social-header">
            <!-- Logo de la galerie -->
            <a href="page-1.html">
  <div class="social-logo">404 ART</div>
</a>
            <h1>Rejoignez-nous</h1>


        </header>

        <main class="social-page">

           
<!-- RÉSEAUX SOCIAUX -->

<nav class="social-links" aria-label="Nos réseaux sociaux">

    <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
    </a>

    <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
        <i class="fa-brands fa-youtube"></i>
    </a>

    <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <i class="fa-brands fa-facebook-f"></i>
    </a>

    <a href="https://x.com/" target="_blank" rel="noopener noreferrer" aria-label="X">
        <i class="fa-brands fa-twitter"></i>
    </a>

</nav>


            <!-- GALERIE DE PHOTOGRAPHIES -->
            <section class="social-gallery" aria-label="Œuvres d'art contemporain">

                <img src="img/bonhomme.jpg" alt="Sculpture contemporaine rouge">
                <img src="img/sculpture dans une galerie.jpg" alt="Sculpture dans une galerie">
                <img src="img/fils.jpg" alt="Installation artistique colorée">
                <img src="img/sculpture sombre.jpg" alt="Sculpture contemporaine sombre">

                <img src="img/oeuvre lumineuse.jpg" alt="Œuvre contemporaine lumineuse">
                <img src="img/installation.jpg" alt="Installation architecturale">
                <img src="img/bleu.jpg" alt="Sculpture abstraite bleue">
                <img src="img/musée.JPG" alt="Installation lumineuse dans une galerie">

            </section>

            <!-- FORMULAIRE D'INSCRIPTION -->
            <section class="newsletter" aria-labelledby="newsletter-title">

                <h2 id="newsletter-title">
                    Inscrivez-vous pour suivre<br>
                    toutes nos actualités
                </h2>

                <form class="newsletter-form" action="#" method="get">

                    <label for="email" class="visually-hidden">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email"
                        autocomplete="email"
                        required
                    >

                    <button type="submit" aria-label="S'inscrire">
                        →
                    </button>

                </form>

            </section>

        </main>

    </div>

</body>
</html>
